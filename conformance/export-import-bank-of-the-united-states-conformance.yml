  note: >-
    DOMAIN-STANDARD SIGNATURE. This is the interoperability standard for US federal open
    data publishing, and the document declares it about itself rather than a marketing
    page claiming it. A harvester that already speaks DCAT-US ingests EXIM's catalog with
    no bespoke connector. Mandated context: OMB M-25-05 Phase 2 / the Foundations for
    Evidence-Based Policymaking Act of 2018, which EXIM names on its Open Data Hub page.
