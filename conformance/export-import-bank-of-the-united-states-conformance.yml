  label: Project Open Data / DCAT-US v1.1
  conforms: true
  method: probed
  evidence: https://img.exim.gov/s3fs-public/dataset/vbhv-d8am/data.json
  evidence_http_status: 200
  declared_in_document: true
  declaration: >-
    "conformsTo": "https://project-open-data.cio.gov/v1.1/schema" and
