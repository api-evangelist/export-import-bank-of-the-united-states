summary: >-
  EXIM declares exactly one standard in a document it publishes itself: Project Open Data
  v1.1 (DCAT-US), asserted by the catalog's own `conformsTo` field. A second standard,
  IIIF Presentation API 2.0, is genuinely served under an exim.gov host but is implemented
  by OCLC CONTENTdm, EXIM's vendor — it is recorded with that attribution and NOT counted
  as an EXIM engineering claim. No OAuth, OIDC, SCIM, OData, JSON:API, RFC 9457 or
  idempotency conformance exists, because EXIM operates no public API.
