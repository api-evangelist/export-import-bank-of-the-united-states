- id: iiif-presentation-2.0
  label: IIIF Presentation API 2.0
  conforms: true
  method: probed
  evidence: https://www.digitalarchives.exim.gov/iiif/ExImPR01:4250/manifest.json
  evidence_http_status: 200
  declaration: '"@context": "http://iiif.io/api/presentation/2/context.json", "@type": "sc:Manifest"'
  operator: vendor
  operator_name: OCLC CONTENTdm
  note: >-
    OPERATOR ATTRIBUTION, per the ownership rule. www.digitalarchives.exim.gov is a CNAME
    to cdm16645.contentdm.oclc.org and the manifest's own @id resolves to that OCLC host.
