description: >-
  The U.S. Export-Import Bank (EXIM) is the official export credit agency of the United
  States federal government. It assists in financing and facilitating U.S. exports of
  goods and services by providing export credit insurance, working capital guarantees,
  loan guarantees and direct loans to help American businesses compete in the global
  marketplace. EXIM operates no public API. Its former Socrata/SODA open data portal at
  data.exim.gov was decommissioned on 2023-09-14 by EXIM's own announcement and the host
  no longer resolves; what remains is a Project Open Data v1.1 (DCAT-US) catalog pointing
  at a quarterly CSV of every authorization approved since FY2007, distributed through
  Data.gov. A separate OCLC CONTENTdm tenant serves EXIM's historical archives over
  CONTENTdm and IIIF Presentation API 2.0 endpoints at an exim.gov address.
