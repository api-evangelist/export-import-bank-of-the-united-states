  description: >-
    EXIM's entire programmatic open-data footprint: a Project Open Data v1.1 (DCAT-US)
    catalog at data.json listing one public dataset — every EXIM authorization approved
    from 10/01/2006 to the current reporting quarter — with a quarterly CSV distribution
    and a PDF data dictionary. Anonymous HTTPS GET, no key, no quota. This is FILE
    DISTRIBUTION, NOT A QUERY API: the SODA/SoQL interface that once served this data at
    data.exim.gov was decommissioned on 2023-09-14. The CSV filename carries the fiscal
    quarter, so consumers must re-read data.json rather than pinning the download URL.
