  description: >-
    26 collections of EXIM's historical record — annual reports, press releases, board
    materials, executive orders, oral histories, reports to Congress — served over
    anonymous JSON endpoints and IIIF Presentation API 2.0 manifests at an exim.gov
    address. OPERATOR ATTRIBUTION: www.digitalarchives.exim.gov is a CNAME to
    cdm16645.contentdm.oclc.org and the IIIF manifests resolve their own @id to that OCLC
    host. EXIM is the tenant and owns the content; the contract is OCLC CONTENTdm's
    product, not an API EXIM engineered. Recorded so the surface is discoverable without
    crediting EXIM with a vendor's API.
